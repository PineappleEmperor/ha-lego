[project]
name = "ha-lego"
version = "0.3.0"
description = "Home Assistant integration for your LEGO collection, backed by Brickset"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "PineappleEmperor" }]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components"]

[tool.ruff.format]
exclude = [
  "conftest.py",
  "scripts/check_release_notes.py",
  "scripts/commit_summary.py",
  "scripts/manifest_gate.py",
  "scripts/release_notes.py",
  "tests/test_commit_summary.py",
  "tests/test_manifest_gate.py",
  "tests/test_release_notes.py",
]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "N",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
  "TRY003", # HA raises HomeAssistantError with inline messages by convention.
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "SLF001", "PLR2004", "INP001"]
"scripts/*" = ["T20", "INP001"]
# Copied verbatim from the ha-integration skill's templates; keep them pristine
# so they can be diffed against the canonical copies.
"scripts/manifest_gate.py" = ["T20", "INP001", "D103", "E501", "PLR0911"]
"tests/test_manifest_gate.py" = ["D100", "D103", "E501", "PT018", "INP001"]
# The first import claims the name `custom_components` before the HA test plugin
# binds it, so isort must not reorder it.
"conftest.py" = ["I001", "PT022", "INP001"]
"scripts/commit_summary.py" = [
  "T20", "INP001", "D103", "D401", "E501", "PLR0911", "PLW2901", "SIM115",
]
"tests/test_commit_summary.py" = ["D100", "D103", "E501", "INP001", "N806"]
"scripts/release_notes.py" = [
  "T20", "INP001", "D103", "D301", "D401", "E402", "E501", "F401", "I001",
  "PLW1510", "RUF100",
]
"scripts/check_release_notes.py" = [
  "T20", "INP001", "D103", "E501", "F401", "PLC0415", "PLR0912", "PLW1510",
  "SIM102",
]
"tests/test_release_notes.py" = ["D100", "D103", "E501", "INP001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pylint.MAIN]
py-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests spend real Brickset calls, so they never run unless asked for.
addopts = "-m 'not live'"
markers = ["live: hits the real Brickset API; needs credentials and spends quota"]
