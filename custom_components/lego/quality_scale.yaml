rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >-
      manifest.json lists no requirements; the Brickset client ships in this
      repository, so there is nothing unpublished to depend on.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers of its own.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions of its own.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe only through CoordinatorEntity; no external callbacks.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  config-entry-unloading: done
  log-when-unavailable: done
  entity-unavailable:
    status: done
    comment: >-
      A failed poll makes the entities unavailable. A spent daily call budget is a
      limit the integration sets itself, not a failure, so the last sync's data is
      kept and the Last synced sensor and the panel show its age.
  action-exceptions: done
  reauthentication-flow: done
  parallel-updates: done
  test-coverage: done
  integration-owner: done
  docs-installation-parameters: done
  docs-configuration-parameters: done

  # Gold
  entity-translations: done
  entity-device-class: done
  devices: done
  entity-category: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is cheap and useful; none warrant being disabled by default.
  discovery:
    status: exempt
    comment: A cloud account cannot be discovered on the network.
  stale-devices:
    status: exempt
    comment: >-
      The only device is the account's service device, one per config entry. It
      cannot go stale while its entry exists and Home Assistant removes it with the
      entry, so async_remove_config_entry_device refuses manual removal.
  diagnostics: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  dynamic-devices:
    status: exempt
    comment: One service device per config entry; sets are entities, not devices.
  discovery-update-info:
    status: exempt
    comment: No discovery, and the cloud endpoint is a fixed hostname.
  repair-issues: done
  docs-use-cases: todo
  docs-supported-devices: done
  docs-supported-functions: done
  docs-data-update: done
  docs-known-limitations: todo
  docs-troubleshooting: todo
  docs-examples: todo

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      No external dependency: the Brickset client is part of this integration and
      already async, on Home Assistant's shared aiohttp session.
  inject-websession: done
  strict-typing: done
