name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Breaking changes"
    labels: [breaking]
  - title: "Features"
    labels: [feature, enhancement]
  - title: "Fixes"
    labels: [fix, bugfix, bug]
  - title: "Documentation"
    labels: [documentation]
  - title: "Maintenance"
    labels: [chore, refactor, ci, build, test, style, performance]
  - title: "Dependencies"
    labels: [dependencies]

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bugfix, bug, documentation, chore, refactor, ci, build, test, style, performance, dependencies]
  default: patch

exclude-labels: [skip-changelog]

# Title-only rules. The autolabeler cannot see commit subjects, and create-dev-pr
# already derives the PR title from the winning commit type, so labelling off the
# title is effectively commit-driven.
autolabeler:
  - label: breaking
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: feature
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: fix
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: documentation
    title:
      - '/^docs(\(.+\))?!?:/'
  - label: refactor
    title:
      - '/^refactor(\(.+\))?!?:/'
  - label: performance
    title:
      - '/^perf(\(.+\))?!?:/'
  - label: test
    title:
      - '/^test(\(.+\))?!?:/'
  - label: ci
    title:
      - '/^ci(\(.+\))?!?:/'
  - label: build
    title:
      - '/^build(\(.+\))?!?:/'
  - label: style
    title:
      - '/^style(\(.+\))?!?:/'
  - label: chore
    title:
      - '/^chore(\(.+\))?!?:/'

replacers:
  - search: '/\s*Co-authored-by:.*$/gm'
    replace: ""
  - search: '/^- (chore\(deps\)|build\(deps\)): /gm'
    replace: "- "

template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
