name: Create Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach lego.zip to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the ZIP
        # hacs.json sets zip_release, so HACS downloads this asset instead of the
        # tag archive. The integration files must sit at the ZIP root.
        run: |
          set -euo pipefail
          cd custom_components/lego
          zip -r ../../lego.zip . -x '*.pyc' -x '__pycache__/*'

      - name: Attach it to the release
        uses: softprops/action-gh-release@v3
        with:
          files: lego.zip
